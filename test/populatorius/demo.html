<!DOCTYPE html>
<div id="container"></div>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const width = 800, height = 800;
    const numPoints = 500;

    // Generate random points
    const points = Array.from({ length: numPoints }, () => [Math.random() * width, Math.random() * height]);

    // Compute Voronoi diagram
    const delaunay = d3.Delaunay.from(points);
    const voronoi = delaunay.voronoi([0, 0, width, height]); // Define bounds

    // Draw the polygons
    const svg = d3.select("#container").append("svg").attr("width", width).attr("height", height);

    svg.selectAll("path")
        .data(Array.from(voronoi.cellPolygons()))
        .enter()
        .append("path")
        .attr("d", d => "M" + d.join("L") + "Z")
        .attr("stroke", "#000")
        .attr("fill", "none");

    svg.selectAll(".delaunay")
        .data(Array.from(delaunay.trianglePolygons()))
        .enter()
        .append("path")
        .attr("d", d => "M" + d.join("L") + "Z")
        .attr("stroke", "#f0f1")
        .attr("fill", "none");

    // Draw the points
    svg.selectAll("circle")
        .data(points)
        .enter()
        .append("circle")
        .attr("cx", d => d[0])
        .attr("cy", d => d[1])
        .attr("r", 3)
        .attr("fill", "red");

    // Append the SVG element.
    document.getElementById("container").append(svg.node());
</script>
